services:
  ml-flow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-flow
    restart: always
    init: true
    volumes:
      - ./app:/app
      - ./data:/data
      - ./cache-modelscope:/root/.cache/modelscope
      - ./ollama:/root/.ollama
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ./.env
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  sing-box:
    build:
      context: ./sing-box
      dockerfile: Dockerfile
    container_name: sing-box-clash
    env_file:
      - ./.env
    ports:
      - "7890:7890" # HTTP proxy
    restart: unless-stopped
